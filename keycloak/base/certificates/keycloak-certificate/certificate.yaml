apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-certificate
spec:
  issuerRef:
    group: cert-manager.io
    name: letsencrypt-production-http01
    kind: ClusterIssuer
  secretName: keycloak-certificate
  duration: 2160h0m0s
  renewBefore: 360h0m0s
  dnsNames:
    - keycloak.computate.org
